services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: iptv
      POSTGRES_USER: iptv
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local_iptv_password_change_me}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U iptv -d iptv"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  api:
    build: .
    environment:
      HTTP_ADDR: ":8080"
      DATABASE_URL: "postgres://iptv:${POSTGRES_PASSWORD:-local_iptv_password_change_me}@db:5432/iptv?sslmode=disable"
      AUTH_CACHE_TTL: "30s"
      CHANNELS_CACHE_TTL: "5s"
      MAX_BODY_BYTES: "1048576"
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      db:
        condition: service_healthy
    stop_grace_period: 15s
    restart: unless-stopped

volumes:
  postgres_data:
